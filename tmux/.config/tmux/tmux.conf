
set -g mouse on
set -s escape-time 0
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

set-option -g prefix C-s

set -g status-interval 1
set -g status-justify centre
set -g status-left-length 20
set -g status-right-length 140

set -g base-index 1
setw -g pane-base-index 1     # make pane numbering consistent with windows
set -g renumber-windows on    # renumber windows when a window is closed
set -g set-titles on          # set terminal title

set -g history-limit 5000 

bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one
bind h previous-window
bind l next-window

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

set -g default-terminal "screen-256color"

set -g monitor-activity on
set -g visual-activity off

setw -g mode-keys vi

bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

set -g status-left ""
set -g status-right "%Y-%m-%d %H:%M"
set -g status-right-length 50

set -g status-position top
# Colors come from ~/.config/tmux/theme.conf (managed by `theme` switcher)
if-shell '[ -f ~/.config/tmux/theme.conf ]' 'source-file ~/.config/tmux/theme.conf'

set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:*qchat*,#{pane_start_command}},Amazon Q,#{pane_current_command}}"

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
