[theme]
# Follow Ghostty's palette as the base, then override UI tokens for Matrix greens.
name = "terminal"

[theme.custom]
# Transparent panel so Ghostty's black bleeds through
panel_bg     = "reset"

# Matrix greens across all UI tokens
accent       = "#00FF41"
surface0     = "#0D1A0D"
surface1     = "#0D2B0D"
surface_dim  = "#0A150A"
overlay0     = "#00802B"
overlay1     = "#00CC33"
text         = "#00FF41"
subtext0     = "#00CC33"
mauve        = "#39FF14"
green        = "#00FF41"
yellow       = "#00CC33"
red          = "#009926"
blue         = "#00FF41"
teal         = "#39FF14"
peach        = "#00CC33"
