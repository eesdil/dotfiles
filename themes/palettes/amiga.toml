# Amiga Workbench 3.x / AmigaShell palette (gray editor, black text)
vim_background = "light"
# Force white-on-blue current line (Workbench list selection)
cursorline_solid = true
bg = "#AAAAAA"
fg = "#000000"
cursor = "#000000"
cursor_text = "#AAAAAA"
selection_bg = "#0055AA"
selection_fg = "#FFFFFF"
accent = "#0055AA"
surface0 = "#999999"
surface1 = "#BBBBBB"
# Ink-like ANSI colors — readable on gray Workbench backgrounds
color0 = "#000000"
color1 = "#AA0000"
color2 = "#007700"
color3 = "#8B4500"
color4 = "#003388"
color5 = "#770077"
color6 = "#006666"
color7 = "#FFFFFF"
color8 = "#555555"
color9 = "#CC0000"
color10 = "#228822"
color11 = "#A05000"
color12 = "#0055AA"
color13 = "#990099"
color14 = "#008888"
color15 = "#FFFFFF"
